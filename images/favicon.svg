<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00eaff"/>
      <stop offset="48%" stop-color="#5654ff"/>
      <stop offset="100%" stop-color="#ff28ef"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="128" height="128" rx="22" fill="#050510"/>

  <g fill="none" stroke="url(#neon)" stroke-width="2.5"
     stroke-linecap="round" filter="url(#glow)">
    <path d="M20 42 A48 48 0 0 1 108 42"/>
    <path d="M20 86 A48 48 0 0 0 108 86"/>
  </g>

  <text x="64" y="72"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="37"
        font-weight="900"
        fill="url(#neon)"
        filter="url(#glow)">404</text>
</svg>